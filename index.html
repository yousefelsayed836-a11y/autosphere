const lancerParts=[['Front Bumper (2016–2018)','Lancer Shark · listing marked out of stock',2000,'brake','lancer-bumper','out'],['Rear Wheel Hub Bearing','CAESER · listed discounted from EGP 1,750',1575,'air','lancer-hub'],['Front Strut Dust Boot','Mitsubishi Lancer Shark',900,'filter','lancer-boot'],['Front Shock Absorber Set','Mitsubishi Lancer Shark',22000,'air','lancer-shock'],['Front Stabilizer Link Set','Mitsubishi Lancer Shark',950,'brake','lancer-links']];
function partsFor(id){return id==='sunny'?sunnyParts:id==='bmw'?bmwParts:id==='lancer'?lancerParts:parts}let selected='all',basket=JSON.parse(localStorage.getItem('autosphere-cart')||'[]');const icons={filter:'<rect x="34" y="25" width="52" height="70" rx="9" fill="#35465c"/><ellipse cx="60" cy="26" rx="26" ry="8" fill="#68798f"/><path d="M42 45h36M42 53h36M42 61h36" stroke="#b8c5d4" stroke-width="3"/>',brake:'<circle cx="60" cy="60" r="43" fill="#9ca9b7"/><circle cx="60" cy="60" r="30" fill="#dce2e8" stroke="#657485" stroke-width="4"/><circle cx="60" cy="60" r="11" fill="#697989"/><path d="M84 29q25 8 18 39l-13 5-9-10z" fill="#d93643"/>',air:'<path d="M20 30h80l-8 60H28z" fill="#3b4859"/><path d="M29 38h62l-6 44H35z" fill="#e4d8b5"/><path d="M38 41l4 38m8-38 3 38m9-38v38m9-38-3 38m13-38-4 38" stroke="#a89c7e" stroke-width="3"/>',spark:'<g transform="rotate(35 60 60)"><rect x="48" y="18" width="24" height="53" rx="5" fill="#e2e6e9" stroke="#8d9baa" stroke-width="3"/><path d="M46 43h28v15H46z" fill="#8999aa"/><path d="M51 69h18v30H51z" fill="#647485"/><path d="M53 75h14m-14 7h14m-14 7h14" stroke="#c6d0da" stroke-width="3"/><path d="M60 18V8m0 91v11" stroke="#47586b" stroke-width="5"/></g>'};
function renderCars(){document.querySelector('#carsGrid').innerHTML=cars.map(c=>`<article class="car"><div class="viewer"><model-viewer src="assets/models/${c.id}.glb" alt="3D model of ${c.name}" camera-controls disable-zoom min-camera-orbit="auto 75deg auto" max-camera-orbit="auto 75deg auto" interaction-prompt="none" shadow-intensity="0.7" exposure="1" environment-image="${c.id === "sunny" ? "legacy" : "neutral"}" camera-orbit="${c.id==="lancer"?"215deg":"35deg"} 75deg 80%" field-of-view="30deg" loading="eager"></model-viewer></div><div class="car-info"><div class="car-title"><h3>${c.name}</h3>${c.year ? `<span>${c.year}</span>` : ""}</div><div class="car-actions"><a class="shop-car" href="#products" data-car="${c.id}">Shop parts</a></div></div></article>`).join('')}

function renderProducts(){document.querySelector('#filters').innerHTML=[{id:'all',name:'All vehicles'},...cars].map(c=>'<button class="'+(selected===c.id?'active':'')+'" data-filter="'+c.id+'">'+c.name+'</button>').join('');document.querySelector('#productGrid').innerHTML=cars.filter(c=>selected==='all'||selected===c.id).flatMap(c=>partsFor(c.id).map((p,i)=>{const soldOut=p[5]==='out',quote=p[5]==='quote'||p[2]===null;const image=p[4]?'<img src="assets/products/'+p[4]+'.webp" alt="'+p[0]+'" loading="lazy">':'<svg viewBox="0 0 120 120" aria-hidden="true">'+icons[p[3]]+'</svg>';const price=quote?'Price on request':(p[5]==='estimate'?'~':'')+p[2].toLocaleString('en')+' <small>EGP</small>';const button=soldOut?'Out of stock':quote?'Contact for price':'Add to cart +';const action='<button class="add" data-add="'+c.id+':'+i+'" '+(soldOut||quote?'disabled':'')+'>'+button+'</button>';return '<article class="product"><div class="part-image">'+image+'</div><div class="product-body"><div class="tag">'+c.name+(c.year?' · '+c.year:'')+'</div><h3>'+p[0]+'</h3><p>'+p[1]+'</p><div class="product-bottom"><span class="price">'+price+'</span>'+action+'</div></div></article>'})).join('')}function cart(){localStorage.setItem('autosphere-cart',JSON.stringify(basket));document.querySelector('#count').textContent=basket.length;document.querySelector('#checkoutButton').disabled=!basket.length;document.querySelector('#cartItems').innerHTML=basket.length?basket.map((x,i)=>'<div class="item"><span>'+x.name+' — '+x.car+'</span><button data-remove="'+i+'">Remove</button></div>').join(''):'<p class="empty">Your cart is empty. Pick a part to get started.</p>';document.querySelector('#total').textContent=basket.length?'Subtotal: '+basket.reduce((a,b)=>a+b.price,0).toLocaleString('en')+' EGP':''}
document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]'),c=e.target.closest('[data-car]'),a=e.target.closest('[data-add]'),r=e.target.closest('[data-remove]');if(f||c){selected=(f||c).dataset.filter||(f||c).dataset.car;renderProducts()}if(a){const bits=a.dataset.add.split(':'),id=bits[0],i=Number(bits[1]),product=partsFor(id)[i];if(!product||product[5]==='out'||product[5]==='quote'||product[2]===null)return;basket.push({name:product[0],price:product[2],car:cars.find(x=>x.id===id).name});cart();a.textContent='Added ✓';a.classList.add('added');setTimeout(()=>{if(a.isConnected){a.textContent='Add to cart +';a.classList.remove('added')}},1200)}if(r){basket.splice(Number(r.dataset.remove),1);cart()}})
document.querySelector('#openCart').onclick=()=>{cart();document.querySelector('#cart').showModal()};document.querySelector('#closeCart').onclick=()=>document.querySelector('#cart').close();document.querySelector('#checkoutButton').onclick=()=>{if(basket.length)window.location.href='checkout.html'};renderCars();renderProducts();cart();
</script></body></html>
